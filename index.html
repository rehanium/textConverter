<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Line Quote Converter for Salesforce | SOQL & Data Loader Text Formatter</title>
    <meta
      name="description"
      content="Free line quote converter for Salesforce admins and developers. Convert multi-line text into quoted, comma-separated values for SOQL IN clauses, Apex, Data Loader, and spreadsheet workflows."
    />
    <meta
      name="keywords"
      content="line quote converter, Salesforce text converter, SOQL IN clause formatter, Apex string list converter, Data Loader value formatter, quote each line tool"
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Line Quote Converter for Salesforce Tasks" />
    <meta
      property="og:description"
      content="Convert line-by-line text into quoted strings for Salesforce SOQL, Apex, and Data Loader workflows."
    />
    <meta property="og:image" content="android-chrome-192x192.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Line Quote Converter for Salesforce Tasks" />
    <meta
      name="twitter:description"
      content="Format line-by-line values into quoted, comma-separated output for SOQL, Apex, and Data Loader use cases."
    />
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png" />
    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Line Quote Converter",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "Convert each line into quoted, comma-separated values for Salesforce SOQL, Apex, and Data Loader workflows.",
        "keywords": "Salesforce, SOQL, Apex, Data Loader, quoted list converter",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "c0990da7102f4352a30a8d1178ff3432"}'></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Line Quote Converter</h1>
        <p>
          Convert each line into a quoted string with a trailing comma, ideal for Salesforce
          SOQL queries, Apex code, and Data Loader value preparation.
        </p>
      </header>

      <section class="controls" aria-label="Conversion settings">
        <div class="control-group">
          <span class="control-label">Quote style</span>
          <div class="quote-options">
            <label>
              <input type="radio" name="quote" value="single" checked />
              Single
            </label>
            <label>
              <input type="radio" name="quote" value="double" />
              Double
            </label>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">Output format</span>
          <div class="output-format-options">
            <label>
              <input type="radio" name="outputFormat" value="newline" checked />
              New line
            </label>
            <label>
              <input type="radio" name="outputFormat" value="space" />
              Space
            </label>
          </div>
        </div>

        <label class="control-group">
          <input id="trimWhitespace" type="checkbox" />
          <span class="control-label">Trim whitespace</span>
        </label>

        <label class="control-group">
          <input id="ignoreEmpty" type="checkbox" checked />
          <span class="control-label">Ignore empty lines</span>
        </label>

        <label class="control-group" for="escapeMode">
          <span class="control-label">Escape</span>
          <select id="escapeMode">
            <option value="none" selected>None</option>
            <option value="single">Single quotes</option>
            <option value="double">Double quotes</option>
            <option value="both">Both quotes</option>
          </select>
        </label>
      </section>

      <section class="panes">
        <article class="pane">
          <div class="pane-header">
            <h2>Input</h2>
            <span id="inputLines" class="count">0 lines</span>
          </div>
          <label for="inputText" class="sr-only">Input text</label>
          <textarea
            id="inputText"
            placeholder="Type or paste multi-line text here..."
            spellcheck="false"
          ></textarea>
          <div class="pane-actions">
            <button id="clearInput" type="button" class="button secondary">Clear Input</button>
          </div>
        </article>

        <article class="pane">
          <div class="pane-header">
            <h2>Output</h2>
            <span id="outputLines" class="count">0 lines</span>
          </div>
          <label for="outputText" class="sr-only">Converted output</label>
          <textarea id="outputText" readonly placeholder="Converted output appears here"></textarea>
          <div class="pane-actions">
            <button id="copyOutput" type="button" class="button primary">Copy Output</button>
          </div>
        </article>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
      <span id="themeIcon" aria-hidden="true">🌙</span>
    </button>

    <script src="script.js"></script>
  </body>
</html>
